        example: "친구에게 차분히 부탁하니 친구도 웃으며 대답했다.",
        before: "모리가 ‘기다려 줘서 고마워!’라고 말하자 친구가 ‘괜찮아, 같이 가자!’라고 답했어요. 어울리는 속담은 ", after: "예요.",
        distractors: ["돌다리도 두들겨 보고 건너라", "소 잃고 외양간 고친다"]

        example: "책상 정리를 짝과 함께 하니 금방 끝났다.",

        distractors: ["세 살 버릇 여든까지 간다", "가는 말이 고와야 오는 말이 곱다"]
      },
      {
        term: "소 잃고 외양간 고친다", meaning: "일이 잘못된 뒤에야 뒤늦게 대비한다는 뜻.",
        example: "물이 들어와 상자가 망가진 뒤에야 지붕의 구멍을 막았다.",
        before: "바구니가 찢어진 걸 보고도 토끼는 그대로 두었어요. 사과를 모두 떨어뜨리고 나서야 찢어진 곳을 꿰맸어요. 어울리는 속담은 ", after: "예요.",
        distractors: ["백지장도 맞들면 낫다", "티끌 모아 태산"]

      {
        term: "세 살 버릇 여든까지 간다", meaning: "어릴 때 생긴 버릇은 나이가 들어도 쉽게 바뀌지 않는다는 뜻.",
        example: "어릴 때부터 책 읽기를 좋아하던 할머니는 지금도 매일 책을 읽으신다.",
        before: "올빼미는 어렸을 때부터 물건을 쓰고 제자리에 놓았어요. 어른이 된 지금도 그 습관을 지켜요. 어울리는 속담은 ", after: "예요.",
        distractors: ["소 잃고 외양간 고친다", "백지장도 맞들면 낫다"]

};

const storageKey = "linkday-013-vocabulary-seeds";
const allLessons = Object.values(trails).flatMap(trail => trail.lessons);
const allTerms = new Set(allLessons.map(lesson => lesson.term));
const seedTotal = allLessons.length;

function loadSeeds() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (Array.isArray(saved)) return new Set(saved.filter(term => allTerms.has(term)));
  } catch {
    // The current tab can still keep progress if storage is unavailable.
  }
  return new Set();
}

const seeds = loadSeeds();
const home = document.querySelector("#home");
const activity = document.querySelector("#activity");
const journal = document.querySelector("#journal");
const activityContent = document.querySelector("#activity-content");
const journalContent = document.querySelector("#journal-content");
const trailGrid = document.querySelector("#trails");
const journalButton = document.querySelector("#open-journal");
let currentTrail;
let lessonIndex = 0;
let lastTrailKey;

function growSeed(term) {
  if (seeds.has(term)) return;
  seeds.add(term);
  try {
    localStorage.setItem(storageKey, JSON.stringify([...seeds]));
  } catch {
    // Progress remains available for review during this visit.
  }
}

function activateView(view, focusTarget) {
  for (const section of [home, activity, journal]) section.hidden = section !== view;
  window.scrollTo(0, 0);
  focusTarget.focus({ preventScroll: true });
}

function drawHome() {
  const progress = document.querySelector("#total-progress");
  progress.max = seedTotal;
  progress.value = seeds.size;
  document.querySelector("#total-count").textContent = `${seeds.size} / ${seedTotal}개`;

  const buttons = Object.entries(trails).map(([key, trail]) => {
    const count = trail.lessons.filter(lesson => seeds.has(lesson.term)).length;
    const button = document.createElement("button");
    button.className = "trail";
    button.type = "button";
    button.dataset.type = key;
    button.innerHTML = `
      <span class="trail-top"><span class="trail-icon" aria-hidden="true">${trail.icon}</span>
        <span class="trail-count">${count} / ${trail.lessons.length}개 ${count === trail.lessons.length ? "발견 완료" : "발견"}</span>
      </span>
      <span class="trail-name">${trail.name}</span>
      <span class="trail-description">${trail.description}</span>
      <span class="trail-action"><span>${count === trail.lessons.length ? "다시 탐험하기" : "숲길 들어가기"}</span><span aria-hidden="true">↗</span></span>`;
    button.addEventListener("click", () => startTrail(key));
    return button;
  });
  trailGrid.replaceChildren(...buttons);
}

function goHome(fromJournal = false) {
  drawHome();
  const target = fromJournal ? journalButton : trailGrid.querySelector(`[data-type="${lastTrailKey}"]`);
  activateView(home, target || document.querySelector("#start"));
}

function startTrail(key) {
  currentTrail = trails[key];
  lastTrailKey = key;
  lessonIndex = 0;
  drawLesson();
}

function activityFrame(guide, content) {
  activityContent.classList.remove("completion");
  activityContent.innerHTML = `
    <div class="activity-head"><p class="activity-trail">${currentTrail.icon} ${currentTrail.name}</p>
      <p class="activity-step">${lessonIndex + 1} / ${currentTrail.lessons.length}</p>
    </div>
    <progress value="${lessonIndex + 1}" max="${currentTrail.lessons.length}" aria-label="숲길 단계"></progress>
    <div class="guide"><span class="guide-icon" aria-hidden="true">🦊</span><p>${guide}</p></div>
    ${content}`;
  activateView(activity, activityContent.querySelector("h2"));
}

function drawLesson() {
  const lesson = currentTrail.lessons[lessonIndex];
  activityFrame("모리와 함께 표현의 뜻을 읽어 봐요.", `
    <h2 tabindex="-1">${lesson.term}</h2>
    <p class="definition">${lesson.meaning}</p>
    <p class="example"><strong>예문</strong> ${lesson.example}</p>
    <button class="primary" id="show-quiz" type="button">이야기 퀴즈 풀기 <span aria-hidden="true">→</span></button>`);
  document.querySelector("#show-quiz").addEventListener("click", () => drawQuiz(lesson));
}

function drawQuiz(lesson) {
  activityFrame("이야기를 읽고 빈칸에 들어갈 표현을 골라 봐요.", `
    <h2 tabindex="-1">이야기 퀴즈</h2>
    <p class="story">${lesson.before}<mark>빈칸</mark>${lesson.after}</p>
    <div class="answers" aria-label="보기"></div>
    <p class="feedback" role="status"></p>
    <button class="primary" id="next-lesson" type="button" hidden>
      ${lessonIndex + 1 === currentTrail.lessons.length ? "탐험 결과 보기" : "다음 표현"} <span aria-hidden="true">→</span>
    </button>`);

  const choices = [...lesson.distractors];
  const rightPosition = Math.floor(Math.random() * (choices.length + 1));
  choices.splice(rightPosition, 0, lesson.term);
  const answers = activityContent.querySelector(".answers");
  const feedback = activityContent.querySelector(".feedback");
  const next = document.querySelector("#next-lesson");

  choices.forEach((choice, index) => {
    const option = document.createElement("button");
    option.className = "answer";
    option.type = "button";
    option.innerHTML = `<span class="answer-number" aria-hidden="true">${index + 1}</span><span>${choice}</span>`;
    option.addEventListener("click", () => {
      if (option.getAttribute("aria-disabled") === "true") return;
      if (choice === lesson.term) {
        growSeed(lesson.term);
        option.classList.add("correct");
        for (const answer of answers.children) {
          answer.setAttribute("aria-disabled", "true");
          answer.tabIndex = -1;
        }
        feedback.dataset.result = "correct";
        feedback.textContent = `맞았어요! ‘${lesson.term}’은 ${lesson.meaning} 🌱`;
        next.hidden = false;
        next.focus({ preventScroll: true });
      } else {
        option.classList.add("incorrect");
        option.setAttribute("aria-disabled", "true");
        feedback.dataset.result = "incorrect";
        feedback.textContent = `다시 도전! ${lesson.meaning} 어떤 표현인지 생각해 봐요.`;
      }
    });
    answers.append(option);
  });
  next.addEventListener("click", () => {
    lessonIndex++;
    if (lessonIndex === currentTrail.lessons.length) drawCompletion();
    else drawLesson();
  });
}

function drawCompletion() {
  activityContent.classList.add("completion");
  const allDone = seeds.size === seedTotal;
  activityContent.innerHTML = `
    <span class="completion-icon" aria-hidden="true">${allDone ? "🌳" : "🌱"}</span>
    <h2 tabindex="-1">${allDone ? "어휘의 숲 탐험 완료!" : `${currentTrail.name} 탐험 완료!`}</h2>
    <p>${allDone ? `표현 ${seedTotal}개의 씨앗을 모두 모았어요.` : `이 숲길에서 표현 ${currentTrail.lessons.length}개의 씨앗을 모았어요.`}</p>
    <div class="completion-actions">
      <button class="primary" id="finish-home" type="button">숲길 지도로</button>
      <button class="secondary" id="finish-journal" type="button">탐험 수첩 보기</button>
    </div>`;
  document.querySelector("#finish-home").addEventListener("click", () => goHome());
  document.querySelector("#finish-journal").addEventListener("click", openJournal);
  activateView(activity, activityContent.querySelector("h2"));
}

function openJournal() {
  journalContent.innerHTML = Object.values(trails).map(trail => {
    const collected = trail.lessons.filter(lesson => seeds.has(lesson.term));
    const entries = collected.map(lesson => `
      <details>
        <summary>${lesson.term}</summary>
        <p>${lesson.meaning}</p>
        <p><strong>예문</strong> ${lesson.example}</p>
      </details>`).join("");
    return `<section class="journal-section">
      <h3>${trail.icon} ${trail.name} · ${collected.length} / ${trail.lessons.length}</h3>
      ${entries || "<p>숲길에 들어가 첫 씨앗을 찾아봐요.</p>"}
    </section>`;
  }).join("");
  activateView(journal, document.querySelector("#journal-title"));
}

document.querySelector("#start").addEventListener("click", () => {
  const unfinished = [...trailGrid.children].find(button =>
    trails[button.dataset.type].lessons.some(lesson => !seeds.has(lesson.term))
  );
  const target = unfinished || trailGrid.firstElementChild;
  target.focus();
  target.scrollIntoView({ block: "nearest" });
});
document.querySelector("#activity-back").addEventListener("click", () => goHome());
document.querySelector("#journal-back").addEventListener("click", () => goHome(true));
journalButton.addEventListener("click", openJournal);
drawHome();
</script>
